<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Grammar Trainer</title>
  <style>
    :root {
      --blue:   #2563eb;
      --blue-l: #eff6ff;
      --blue-d: #1d4ed8;
      --green:  #16a34a;
      --green-l:#f0fdf4;
      --red:    #dc2626;
      --red-l:  #fef2f2;
      --amber:  #d97706;
      --amber-l:#fffbeb;
      --purple: #7c3aed;
      --purple-l:#f5f3ff;
      --bg:     #f1f5f9;
      --card:   #ffffff;
      --border: #e2e8f0;
      --text:   #0f172a;
      --muted:  #64748b;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.6;
    }

    /* ── ナビゲーション ── */
    .nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .nav-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 56px;
    }
    .nav-logo {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--blue);
      letter-spacing: -.5px;
      margin-right: auto;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .875rem;
      font-weight: 600;
      background: transparent;
      color: var(--muted);
      transition: background .15s, color .15s;
      position: relative;
    }
    .nav-btn:hover { background: var(--bg); color: var(--text); }
    .nav-btn.active { background: var(--blue-l); color: var(--blue); }
    .badge {
      background: var(--red);
      color: #fff;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
    }

    /* ── メインコンテンツ ── */
    .view {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* ── カード ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* ── ダッシュボード ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (min-width: 480px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      text-align: center;
    }
    .stat-num {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .s-blue   { color: var(--blue); }
    .s-green  { color: var(--green); }
    .s-amber  { color: var(--amber); }
    .s-purple { color: var(--purple); }

    .alert {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--amber-l);
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: .9rem;
      font-weight: 500;
    }
    .alert-icon { font-size: 1.3rem; flex-shrink: 0; }
    .alert-success {
      background: var(--green-l);
      border-color: #86efac;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (min-width: 480px) { .action-grid { grid-template-columns: repeat(3, 1fr); } }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 12px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 700;
      font-size: .9rem;
      color: var(--text);
      transition: border-color .15s, background .15s, transform .1s;
    }
    .action-btn:hover {
      border-color: var(--blue);
      background: var(--blue-l);
      transform: translateY(-2px);
      color: var(--blue);
    }
    .action-btn .icon { font-size: 1.8rem; }
    .action-btn .sub { font-size: .75rem; color: var(--muted); font-weight: 500; }

    /* 進捗バー */
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
      transition: width .4s ease;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: .78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* レベル分布 */
    .level-bars {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 60px;
      margin-top: 12px;
    }
    .level-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .level-bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transition: height .4s;
    }
    .level-bar-label { font-size: .65rem; color: var(--muted); }

    /* ── 問題画面 ── */
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .session-info { font-size: .85rem; color: var(--muted); font-weight: 500; }
    .session-progress { font-size: .85rem; font-weight: 700; color: var(--blue); }

    .q-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 28px 24px;
      margin-bottom: 16px;
    }
    .q-num {
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 12px;
    }
    .q-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.8;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .q-blank {
      display: inline-block;
      min-width: 80px;
      border-bottom: 2px solid var(--blue);
      color: var(--blue);
      font-weight: 700;
    }

    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .choice-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      background: var(--card);
      text-align: left;
      font-size: .95rem;
      font-weight: 500;
      color: var(--text);
      transition: border-color .15s, background .15s;
      width: 100%;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--blue);
      background: var(--blue-l);
    }
    .choice-label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg);
      font-weight: 800;
      font-size: .85rem;
      flex-shrink: 0;
      border: 2px solid var(--border);
      color: var(--muted);
    }
    .choice-btn.correct {
      border-color: var(--green);
      background: var(--green-l);
    }
    .choice-btn.correct .choice-label {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .choice-btn.wrong {
      border-color: var(--red);
      background: var(--red-l);
    }
    .choice-btn.wrong .choice-label {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .choice-btn:disabled { cursor: default; }

    /* フィードバック */
    .feedback {
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 16px;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .feedback.correct-fb {
      background: var(--green-l);
      border: 1px solid #86efac;
    }
    .feedback.wrong-fb {
      background: var(--red-l);
      border: 1px solid #fca5a5;
    }
    .feedback-title {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }
    .feedback.correct-fb .feedback-title { color: var(--green); }
    .feedback.wrong-fb   .feedback-title { color: var(--red); }

    .detail-section { margin-top: 12px; }
    .detail-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .detail-text { font-size: .9rem; color: var(--text); line-height: 1.7; }

    .next-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .next-btn:hover { background: var(--blue-d); }

    /* セッション結果 */
    .result-card {
      text-align: center;
      padding: 40px 24px;
    }
    .result-emoji { font-size: 3.5rem; margin-bottom: 16px; }
    .result-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
    .result-sub   { font-size: 1rem; color: var(--muted); margin-bottom: 24px; }
    .result-score {
      display: inline-flex;
      gap: 32px;
      background: var(--bg);
      border-radius: 12px;
      padding: 16px 32px;
      margin-bottom: 28px;
    }
    .score-item { text-align: center; }
    .score-num { font-size: 2rem; font-weight: 800; }
    .score-lbl { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
    }

    /* ── 統計画面 ── */
    .stats-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mini-stat {
      background: var(--bg);
      border-radius: 10px;
      padding: 14px;
    }
    .mini-stat-num { font-size: 1.4rem; font-weight: 800; color: var(--blue); }
    .mini-stat-lbl { font-size: .78rem; color: var(--muted); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 12px;
    }
    .cal-day {
      aspect-ratio: 1;
      border-radius: 4px;
      background: var(--border);
    }
    .cal-day.has-study { background: var(--blue); opacity: .7; }
    .cal-day.today { outline: 2px solid var(--blue); }

    /* ── ローディング・エラー ── */
    .center-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 520px;
    }
    .error-box h2 { font-size: 1.2rem; margin-bottom: 8px; }
    .error-box p  { color: var(--muted); font-size: .9rem; line-height: 1.7; }
    .code {
      background: #1e293b;
      color: #94a3b8;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: .85rem;
      margin: 12px 0;
      text-align: left;
    }

    /* ── レビュースケジュール表示 ── */
    .review-schedule {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .level-chip {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 700;
    }
    .lv0 { background: #f1f5f9; color: var(--muted); }
    .lv1 { background: #dbeafe; color: #1d4ed8; }
    .lv2 { background: #d1fae5; color: #065f46; }
    .lv3 { background: #fef3c7; color: #92400e; }
    .lv4 { background: #ede9fe; color: #5b21b6; }
    .lv5 { background: #fce7f3; color: #9d174d; }
    .lv6 { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }

    /* ── インポートモーダル ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 6px; }
    .modal p  { font-size: .85rem; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
    .modal textarea {
      width: 100%;
      height: 180px;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: .82rem;
      font-family: monospace;
      resize: vertical;
      margin-bottom: 12px;
    }
    .modal textarea:focus { outline: none; border-color: var(--blue); }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

<!-- ナビゲーション -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">📚 TOEIC Grammar</div>
    <button class="nav-btn active" id="nav-dash" onclick="showView('dashboard')">ホーム</button>
    <button class="nav-btn" id="nav-study" onclick="showView('study-menu')">学習</button>
    <button class="nav-btn" id="nav-stats" onclick="showView('stats')">
      統計 <span class="badge" id="review-badge" style="display:none">0</span>
    </button>
  </div>
</nav>

<!-- メインビュー -->
<div class="view" id="view"></div>

<!-- インポートモーダル -->
<div class="modal-overlay" id="import-modal" style="display:none" onclick="if(event.target===this)closeImport()">
  <div class="modal">
    <h2>📋 問題データを貼り付け</h2>
    <p>ブックマークレットで取得した JSON テキストをここに貼り付けてください。<br>
       ブックマークレット実行後に表示されるテキストを「全選択→コピー」して貼り付けます。</p>
    <textarea id="import-textarea" placeholder='[ { "id": 1, "question": "...", ... } ]'></textarea>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeImport()">キャンセル</button>
      <button class="btn btn-primary" onclick="doImport()">読み込む</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  エビングハウス忘却曲線 設定
// ═══════════════════════════════════════════════════════════════
const REVIEW_INTERVALS = [1, 3, 7, 14, 30, 60, 90]; // 日数（レベル別）
const LEVEL_LABELS     = ['新規','1日','3日','1週','2週','1月','2月','定着'];
const LEVEL_COLORS     = ['#94a3b8','#3b82f6','#22c55e','#f59e0b','#a78bfa','#ec4899','#10b981'];
const DAY_MS           = 86400000;

function nextReview(level) {
  const days = REVIEW_INTERVALS[Math.min(level, REVIEW_INTERVALS.length - 1)];
  return Date.now() + days * DAY_MS;
}

function isDue(p) {
  if (!p || p.level === undefined) return true;
  if (p.level === 0) return true;
  return !p.nextReview || Date.now() >= p.nextReview;
}

function formatNextReview(p) {
  if (!p || !p.nextReview) return '今すぐ';
  const diff = p.nextReview - Date.now();
  if (diff <= 0) return '今すぐ';
  const days = Math.ceil(diff / DAY_MS);
  if (days === 1) return '明日';
  if (days < 7)  return `${days}日後`;
  if (days < 30) return `${Math.ceil(days/7)}週間後`;
  return `${Math.ceil(days/30)}ヶ月後`;
}

// ═══════════════════════════════════════════════════════════════
//  ストレージ
// ═══════════════════════════════════════════════════════════════
const STORAGE_KEY    = 'toeic_v2';
const HISTORY_KEY    = 'toeic_history_v2';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch { return []; }
}

function saveHistory(h) {
  // 直近90日分のみ保持
  const cutoff = Date.now() - 90 * DAY_MS;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h.filter(x => x.ts > cutoff)));
}

function recordStudy(qid, correct) {
  const h = loadHistory();
  h.push({ ts: Date.now(), qid, correct });
  saveHistory(h);
}

function updateQProgress(progress, qid, correct) {
  const p = progress[qid] || { level: 0, correctCount: 0, wrongCount: 0, nextReview: null, firstStudied: Date.now() };
  if (correct) {
    p.level       = Math.min((p.level || 0) + 1, REVIEW_INTERVALS.length);
    p.correctCount = (p.correctCount || 0) + 1;
  } else {
    p.level       = 0;
    p.wrongCount  = (p.wrongCount || 0) + 1;
  }
  p.nextReview   = nextReview(p.level);
  p.lastReviewed = Date.now();
  progress[qid]  = p;
  return progress;
}

// ═══════════════════════════════════════════════════════════════
//  アプリ状態
// ═══════════════════════════════════════════════════════════════
let questions  = [];
let progress   = loadProgress();
let session    = null;   // { queue, idx, correct, wrong, mode }
let usingDemo  = false;

// ── デモ問題（questions.json がない場合） ──────────────────────
const DEMO_QUESTIONS = [
  {
    id: 1,
    question: "The committee _____ three times since the beginning of this year.",
    choices: { A:"has met", B:"met", C:"meets", D:"had met" },
    answer: "A",
    translation: "委員会は今年の初めから3回会合を開いてきた。",
    explanation: "since（〜以来）は現在完了形と一緒に使います。動作の継続・経験・完了を表す場合に現在完了（have/has + 過去分詞）を使います。",
    vocabulary: "committee: 委員会 / since: 〜以来 / beginning: 初め"
  },
  {
    id: 2,
    question: "All employees are required to _____ their ID badges at all times.",
    choices: { A:"wearing", B:"wore", C:"wear", D:"worn" },
    answer: "C",
    translation: "全従業員は常にIDバッジを着用することが求められています。",
    explanation: "require + to 不定詞の構文。「are required to + 動詞の原形」なので wear が正解です。",
    vocabulary: "employee: 従業員 / require: 要求する / badge: バッジ / at all times: 常に"
  },
  {
    id: 3,
    question: "The new software _____ by the IT department next week.",
    choices: { A:"will install", B:"will be installed", C:"is installing", D:"installs" },
    answer: "B",
    translation: "新しいソフトウェアは来週IT部門によってインストールされる予定です。",
    explanation: "主語「The new software」はインストールされる側なので受動態を使います。未来の受動態は will be + 過去分詞です。",
    vocabulary: "software: ソフトウェア / install: インストールする / IT department: IT部門"
  },
  {
    id: 4,
    question: "Please submit your report _____ Friday at the latest.",
    choices: { A:"until", B:"by", C:"since", D:"for" },
    answer: "B",
    translation: "遅くとも金曜日までにレポートを提出してください。",
    explanation: "「by + 期限」は「〜までに（完了）」。「until」は状態の継続を表します（例: Wait until Friday）。期限の意味では by が正解です。",
    vocabulary: "submit: 提出する / at the latest: 遅くとも / by: 〜までに"

// ═══════════════════════════════════════════════════════════════
//  問題データ読み込み
// ═══════════════════════════════════════════════════════════════
const Q_DATA_KEY = 'toeic_questions_data';

async function loadQuestions() {
  // 1. localStorage にインポート済みデータがあれば優先使用
  const stored = localStorage.getItem(Q_DATA_KEY);
  if (stored) {
    try {
      const data = JSON.parse(stored);
      if (Array.isArray(data) && data.length > 0) {
        questions = data;
        usingDemo = false;
        return true;
      }
    } catch {}
  }
  // 2. questions.json をフェッチ（ローカルサーバー経由の場合）
  try {
    const r = await fetch('questions.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    questions = await r.json();
    usingDemo = false;
    return true;
  } catch {
    questions = DEMO_QUESTIONS;
    usingDemo = true;
    return false;
  }
}

// ── JSONインポート ────────────────────────────────────────────────
function openImport() {
  document.getElementById('import-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('import-textarea').focus(), 100);
}

function closeImport() {
  document.getElementById('import-modal').style.display = 'none';
  document.getElementById('import-textarea').value = '';
}

function doImport() {
  const text = document.getElementById('import-textarea').value.trim();
  if (!text) { alert('テキストが空です'); return; }
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data) || data.length === 0) throw new Error();
    localStorage.setItem(Q_DATA_KEY, text);
    questions = data;
    usingDemo = false;
    closeImport();
    showView('dashboard');
    alert(`✅ ${data.length}問を読み込みました！`);
  } catch {
    alert('エラー：正しいJSONではありません。ブックマークレット実行後のテキストを全選択してコピーし、貼り付けてください。');
  }
}

// ═══════════════════════════════════════════════════════════════
//  キュービルダー
// ═══════════════════════════════════════════════════════════════
function buildQueue(mode, shuffle = true) {
  let ids;
  if (mode === 'review') {
    ids = questions
      .filter(q => {
        const p = progress[q.id];
        return p && p.level > 0 && isDue(p);
      })
      .map(q => q.id);
  } else if (mode === 'new') {
    ids = questions
      .filter(q => !progress[q.id] || progress[q.id].level === 0)
      .map(q => q.id)
      .slice(0, 20);
  } else {
    // 'all': 未習得の全問題
    ids = questions
      .filter(q => {
        const p = progress[q.id];
        return !p || p.level < REVIEW_INTERVALS.length;
      })
      .map(q => q.id);
  }

  if (shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
  }
  return ids;
}

// ═══════════════════════════════════════════════════════════════
//  統計ヘルパー
// ═══════════════════════════════════════════════════════════════
function calcStats() {
  const total    = questions.length;
  const studied  = Object.keys(progress).length;
  const mastered = Object.values(progress).filter(p => p.level >= REVIEW_INTERVALS.length).length;
  const dueToday = questions.filter(q => isDue(progress[q.id]) && progress[q.id]?.level > 0).length;
  const newCount = questions.filter(q => !progress[q.id] || progress[q.id].level === 0).length;

  const levelCounts = new Array(REVIEW_INTERVALS.length + 1).fill(0);
  questions.forEach(q => {
    const lv = progress[q.id]?.level ?? 0;
    levelCounts[Math.min(lv, REVIEW_INTERVALS.length)]++;
  });

  const history = loadHistory();
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayAnswers = history.filter(h => h.ts >= todayStart.getTime());
  const todayCorrect = todayAnswers.filter(h => h.correct).length;
  const todayTotal   = todayAnswers.length;

  return { total, studied, mastered, dueToday, newCount, levelCounts, todayCorrect, todayTotal };
}

function renderQuestion() {
  if (!session || session.idx >= session.queue.length) {
    renderResult();
    return;
  }

  const qid = session.queue[session.idx];
  const q   = questions.find(x => x.id === qid);
  if (!q) { session.idx++; renderQuestion(); return; }

  const p   = progress[qid];
  const lv  = p?.level ?? 0;
  const total = session.queue.length;

  const qText = q.question.replace(/_{3,}/g, '<span class="q-blank">　　　　</span>');

  document.getElementById('view').innerHTML = `
    <div class="session-header">
      <div class="session-info">${session.mode === 'review' ? '🔄 復習' : '📖 学習'}モード</div>
      <div class="session-progress">${session.idx + 1} / ${total}</div>
    </div>
    <div style="margin-bottom:12px">
      <div class="progress-bar">
        <div class="progress-fill" style="width:${Math.round(session.idx/total*100)}%"></div>
      </div>
    </div>

    <div class="q-card">
      <div class="q-num">
        第 ${q.id} 問
        <span class="level-chip lv${Math.min(lv,6)}" style="margin-left:8px">${LEVEL_LABELS[Math.min(lv,7)]}</span>
      </div>
      <div class="q-text">${qText}</div>
      <div class="choices" id="choices">
        ${['A','B','C','D'].map(letter => `
          <button class="choice-btn" id="choice-${letter}" onclick="selectAnswer('${letter}','${qid}')">
            <span class="choice-label">${letter}</span>
            <span>${escHtml(q.choices[letter] || '')}</span>
          </button>
        `).join('')}
      </div>
    </div>
    <div id="feedback"></div>
  `;
}

function selectAnswer(selected, qid) {
  const q       = questions.find(x => x.id == qid);
  const correct = selected === q.answer;

  // ボタン無効化＋色付け
  ['A','B','C','D'].forEach(l => {
    const btn = document.getElementById('choice-' + l);
    btn.disabled = true;
    if (l === q.answer) btn.classList.add('correct');
    else if (l === selected && !correct) btn.classList.add('wrong');
  });

  // 進捗更新
  progress = updateQProgress(progress, qid, correct);
  saveProgress(progress);
  recordStudy(qid, correct);
  if (correct) session.correct++; else session.wrong++;

  // 次回復習日
  const p = progress[qid];
  const nextDate = formatNextReview(p);

  // フィードバック表示
  const fb = document.getElementById('feedback');
  fb.innerHTML = `
    <div class="feedback ${correct ? 'correct-fb' : 'wrong-fb'}">
      <div class="feedback-title">${correct ? '✅ 正解！' : `❌ 不正解（正解: (${q.answer}) ${escHtml(q.choices[q.answer])}）`}</div>
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:10px">
        次回の復習: <b>${nextDate}</b>（記憶レベル: Lv${p.level} → ${LEVEL_LABELS[Math.min(p.level,7)]}）
      </div>
      ${q.translation ? `<div class="detail-section">
        <div class="detail-label">訳</div>
        <div class="detail-text">${escHtml(q.translation)}</div>
      </div>` : ''}
      ${q.explanation ? `<div class="detail-section">
        <div class="detail-label">解説</div>
        <div class="detail-text">${escHtml(q.explanation)}</div>
      </div>` : ''}
      ${q.vocabulary ? `<div class="detail-section">
        <div class="detail-label">語彙</div>
        <div class="detail-text">${escHtml(q.vocabulary)}</div>
      </div>` : ''}
    </div>
    <button class="next-btn" onclick="nextQuestion()">
      ${session.idx + 1 < session.queue.length ? '次の問題 →' : '結果を見る'}
    </button>
  `;
  updateBadge();
}

function nextQuestion() {
  session.idx++;
  renderQuestion();
  document.getElementById('view').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  const pct = s.total ? Math.round(s.mastered / s.total * 100) : 0;

  // 直近30日のカレンダー
  const history = loadHistory();
  const studyDays = new Set(history.map(h => {
    const d = new Date(h.ts); d.setHours(0,0,0,0); return d.getTime();
  }));
  const today = new Date(); today.setHours(0,0,0,0);
  const calCells = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today - i * DAY_MS);
    d.setHours(0,0,0,0);
    const isToday   = d.getTime() === today.getTime();
    const hasStudy  = studyDays.has(d.getTime());
    calCells.push(`<div class="cal-day${hasStudy?' has-study':''}${isToday?' today':''}"></div>`);
  }

  return `
    <div class="card">
      <div class="card-title">今日の学習</div>
      <div class="stats-detail-grid">
        <div class="mini-stat">
          <div class="mini-stat-num">${s.todayTotal}</div>
          <div class="mini-stat-lbl">解答数</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-num" style="color:var(--green)">${acc}%</div>
          <div class="mini-stat-lbl">正解率</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-num" style="color:var(--amber)">${s.dueToday}</div>
          <div class="mini-stat-lbl">今日の復習予定</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-num" style="color:var(--purple)">${s.mastered}</div>
          <div class="mini-stat-lbl">定着済み</div>
        </div>
      </div>
    </div>

      <div class="card-title">全体進捗 (${pct}%)</div>
      <div class="progress-bar" style="height:12px">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="progress-labels">
        <span>学習済み: ${s.studied}問</span>
        <span>定着: ${s.mastered} / ${s.total}</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">エビングハウス 記憶レベル分布</div>
      <div class="level-bars" id="lvbars-stats"></div>
      <div class="review-schedule" style="margin-top:14px">
        ${LEVEL_LABELS.map((l,i)=>`<span class="level-chip lv${Math.min(i,6)}">${l}: ${s.levelCounts[i]??0}問</span>`).join('')}
      </div>

      <div class="card-title">学習カレンダー（直近30日）</div>

      <div class="card-title">次回復習スケジュール</div>
      ${renderUpcomingReviews()}

    <div style="text-align:center;margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:center">
      <button class="btn btn-outline" style="font-size:.8rem"

function renderUpcomingReviews() {
  const upcoming = questions
    .filter(q => {
      const p = progress[q.id];
      return p && p.level > 0 && p.nextReview;
    })
    .sort((a, b) => (progress[a.id].nextReview || 0) - (progress[b.id].nextReview || 0))
    .slice(0, 10);

  if (!upcoming.length) return '<div style="color:var(--muted);font-size:.9rem">まだ復習予定がありません</div>';

  return upcoming.map(q => {
    const p = progress[q.id];
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem">
      <span>Q${q.id}: ${escHtml(q.question.slice(0,40))}…</span>
      <span class="level-chip lv${Math.min(p.level,6)}">${formatNextReview(p)}</span>
    </div>`;
  }).join('');
}

    return `<div class="level-bar-wrap">

      <div class="level-bar-label">Lv${i}</div>

  }).join('');
}

  });

  if (name === 'dashboard') {
    document.getElementById('nav-dash').classList.add('active');
    view.innerHTML = renderDashboard();
    renderLevelBarsById('lvbars', calcStats());

  } else if (name === 'stats') {
    document.getElementById('nav-stats').classList.add('active');
    view.innerHTML = renderStats();
    renderLevelBarsById('lvbars-stats', calcStats());

  } else if (name === 'study-menu') {
    document.getElementById('nav-study').classList.add('active');
    const s = calcStats();
    view.innerHTML = `
      <div class="card" style="text-align:center;padding:32px">
        <div style="font-size:2rem;margin-bottom:12px">📚</div>
        <div style="font-size:1.2rem;font-weight:800;margin-bottom:24px">学習モードを選んでください</div>
        <div class="action-grid" style="max-width:500px;margin:0 auto">

function startSession(mode) {
  const queue = buildQueue(mode);
  if (queue.length === 0) {
    alert(mode === 'review' ? '今日の復習予定はありません！' : '問題がありません。');
    return;
  }
  session = { queue, idx: 0, correct: 0, wrong: 0, mode };
  document.getElementById('nav-study').classList.add('active');
  ['nav-dash','nav-stats'].forEach(id => document.getElementById(id)?.classList.remove('active'));
  renderQuestion();
}

function updateBadge() {
  const s   = calcStats();
  const b   = document.getElementById('review-badge');
  if (!b) return;
  if (s.dueToday > 0) {
    b.style.display = '';
    b.textContent   = s.dueToday;
  } else {
    b.style.display = 'none';
  }
}

function resetAll() {
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(HISTORY_KEY);
  progress = {};
  showView('dashboard');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════
//  初期化
// ═══════════════════════════════════════════════════════════════
(async () => {
  document.getElementById('view').innerHTML = `
    <div class="center-box">
      <div class="spinner"></div>
      <div style="color:var(--muted)">問題データを読み込み中...</div>
    </div>`;

  const ok = await loadQuestions();

  if (!ok) {
    console.warn('questions.json が見つかりません。デモモードで起動します。');
  }

  progress = loadProgress();
  showView('dashboard');
  updateBadge();
})();
</script>
