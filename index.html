<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Grammar Trainer</title>
  <style>
    :root {
      --blue:   #2563eb; --blue-l: #eff6ff; --blue-d: #1d4ed8;
      --green:  #16a34a; --green-l:#f0fdf4;
      --red:    #dc2626; --red-l:  #fef2f2;
      --amber:  #d97706; --amber-l:#fffbeb;
      --purple: #7c3aed; --purple-l:#f5f3ff;
      --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --muted: #64748b;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; line-height: 1.6;
    }

    /* ── ナビ ── */
    .nav {
      background: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
    }
    .nav-inner {
      max-width: 760px; margin: 0 auto; padding: 0 12px;
      display: flex; align-items: center; gap: 2px; height: 56px;
    }
    .nav-logo {
      font-weight: 800; font-size: 1rem; color: var(--blue);
      letter-spacing: -.5px; margin-right: auto; cursor: pointer;
      white-space: nowrap;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 5px; padding: 6px 11px;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: .85rem; font-weight: 600; background: transparent;
      color: var(--muted); transition: background .15s, color .15s;
      position: relative; white-space: nowrap;
    }
    .nav-btn:hover { background: var(--bg); color: var(--text); }
    .nav-btn.active { background: var(--blue-l); color: var(--blue); }
    .badge {
      background: var(--red); color: #fff; border-radius: 999px;
      font-size: .7rem; font-weight: 700; padding: 1px 6px; min-width: 18px; text-align: center;
    }
    .user-chip {
      display: flex; align-items: center; gap: 5px; padding: 5px 10px;
      border: 1.5px solid var(--border); border-radius: 999px; cursor: pointer;
      font-size: .8rem; font-weight: 600; background: var(--card); color: var(--text);
      transition: border-color .15s; white-space: nowrap; margin-left: 4px;
    }
    .user-chip:hover { border-color: var(--blue); color: var(--blue); }

    /* ── メイン ── */
    .view { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }

    /* ── カード ── */
    .card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
    }
    .card-title {
      font-size: .75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); margin-bottom: 8px;
    }

    /* ── ダッシュボード ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 20px;
    }
    @media (min-width:480px) { .stats-grid { grid-template-columns: repeat(4,1fr); } }
    .stat-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; text-align: center;
    }
    .stat-num { font-size: 2rem; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .s-blue { color: var(--blue); } .s-green { color: var(--green); }
    .s-amber { color: var(--amber); } .s-purple { color: var(--purple); }

    .alert {
      display: flex; align-items: center; gap: 10px;
      background: var(--amber-l); border: 1px solid #fde68a;
      border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px;
      font-size: .9rem; font-weight: 500;
    }
    .alert-icon { font-size: 1.3rem; flex-shrink: 0; }
    .alert-success { background: var(--green-l); border-color: #86efac; }

    .action-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
    }
    @media (min-width:480px) { .action-grid { grid-template-columns: repeat(3,1fr); } }
    .action-btn {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; padding: 20px 12px;
      background: var(--card); border: 2px solid var(--border);
      border-radius: var(--radius); cursor: pointer;
      font-weight: 700; font-size: .9rem; color: var(--text);
      transition: border-color .15s, background .15s, transform .1s;
    }
    .action-btn:hover:not(:disabled) {
      border-color: var(--blue); background: var(--blue-l);
      transform: translateY(-2px); color: var(--blue);
    }
    .action-btn:disabled { opacity: .45; cursor: not-allowed; }
    .action-btn .icon { font-size: 1.8rem; }
    .action-btn .sub { font-size: .75rem; color: var(--muted); font-weight: 500; }

    /* ── 進捗バー ── */
    .progress-bar {
      height: 8px; background: var(--border);
      border-radius: 999px; overflow: hidden; margin-top: 8px;
    }
    .progress-fill {
      height: 100%; background: var(--blue);
      border-radius: 999px; transition: width .4s ease;
    }
    .progress-labels {
      display: flex; justify-content: space-between;
      font-size: .78rem; color: var(--muted); margin-top: 4px;
    }

    /* ── レベル分布バー ── */
    .level-bars {
      display: flex; gap: 4px; align-items: flex-end; height: 60px; margin-top: 12px;
    }
    .level-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .level-bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 4px; transition: height .4s; }
    .level-bar-label { font-size: .6rem; color: var(--muted); }

    /* ── 問題画面 ── */
    .session-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .session-info { font-size: .85rem; color: var(--muted); font-weight: 500; }
    .session-progress { font-size: .85rem; font-weight: 700; color: var(--blue); }
    .q-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow-md); padding: 28px 24px; margin-bottom: 16px;
    }
    .q-num {
      font-size: .78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
    }
    .q-text {
      font-size: 1.15rem; font-weight: 500; line-height: 1.8;
      margin-bottom: 4px; word-break: break-word;
    }
    .q-blank {
      display: inline-block; min-width: 80px;
      border-bottom: 2px solid var(--blue); color: var(--blue); font-weight: 700;
    }
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .choice-btn {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
      border: 2px solid var(--border); border-radius: 10px; cursor: pointer;
      background: var(--card); text-align: left; font-size: .95rem;
      font-weight: 500; color: var(--text);
      transition: border-color .15s, background .15s; width: 100%;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-l); }
    .choice-label {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%; background: var(--bg);
      font-weight: 800; font-size: .85rem; flex-shrink: 0;
      border: 2px solid var(--border); color: var(--muted);
    }
    .choice-btn.correct { border-color: var(--green); background: var(--green-l); }
    .choice-btn.correct .choice-label { background: var(--green); border-color: var(--green); color: #fff; }
    .choice-btn.wrong { border-color: var(--red); background: var(--red-l); }
    .choice-btn.wrong .choice-label { background: var(--red); border-color: var(--red); color: #fff; }
    .feedback {
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .feedback.correct-fb { background: var(--green-l); border-color: #86efac; }
    .feedback.wrong-fb   { background: var(--red-l);   border-color: #fca5a5; }
    .feedback-title { font-size: 1rem; font-weight: 800; margin-bottom: 10px; }
    .feedback.correct-fb .feedback-title { color: var(--green); }
    .feedback.wrong-fb   .feedback-title { color: var(--red); }
    .detail-section { margin-top: 12px; }
    .detail-label {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); margin-bottom: 4px;
    }
    .detail-text { font-size: .9rem; line-height: 1.7; white-space: pre-wrap; }
    .next-btn {
      display: block; width: 100%; padding: 16px; background: var(--blue);
      color: #fff; border: none; border-radius: 10px; font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: opacity .15s; margin-top: 8px;
    }
    .next-btn:hover { opacity: .88; }

    /* ── セッション結果 ── */
    .result-card { text-align: center; padding: 40px 24px; }
    .result-emoji { font-size: 3.5rem; margin-bottom: 16px; }
    .result-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
    .result-sub   { font-size: 1rem; color: var(--muted); margin-bottom: 24px; }
    .result-score {
      display: inline-flex; gap: 32px; background: var(--bg);
      border-radius: 12px; padding: 16px 32px; margin-bottom: 28px;
    }
    .score-item { text-align: center; }
    .score-num { font-size: 2rem; font-weight: 800; }
    .score-lbl { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px; border-radius: 10px; border: none;
      font-size: .95rem; font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-outline {
      background: transparent; border: 2px solid var(--border); color: var(--text);
    }

    /* ── 統計画面 ── */
    .stats-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mini-stat { background: var(--bg); border-radius: 10px; padding: 14px; }
    .mini-stat-num { font-size: 1.4rem; font-weight: 800; color: var(--blue); }
    .mini-stat-lbl { font-size: .78rem; color: var(--muted); }

    /* ── 学習カレンダー ── */
    .cal-month-row {
      display: grid; grid-template-columns: repeat(7,1fr); gap: 2px;
      margin-bottom: 2px;
    }
    .cal-weekday {
      text-align: center; font-size: .6rem; font-weight: 600;
      color: var(--muted); padding: 2px 0;
    }
    .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-top: 4px; }
    .cal-day {
      aspect-ratio: 1; border-radius: 5px; background: var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: default; position: relative; overflow: hidden;
    }
    .cal-day-num { font-size: .6rem; font-weight: 600; color: var(--muted); line-height: 1; }
    .cal-day.s1  { background: #bfdbfe; } .cal-day.s1  .cal-day-num { color: #1e40af; }
    .cal-day.s2  { background: #93c5fd; } .cal-day.s2  .cal-day-num { color: #1e40af; }
    .cal-day.s3  { background: #60a5fa; } .cal-day.s3  .cal-day-num { color: #fff; }
    .cal-day.s4  { background: #3b82f6; } .cal-day.s4  .cal-day-num { color: #fff; }
    .cal-day.s5  { background: #2563eb; } .cal-day.s5  .cal-day-num { color: #fff; }
    .cal-day.today { outline: 2px solid var(--blue); outline-offset: 1px; }
    .cal-cnt { font-size: .5rem; color: inherit; opacity: .8; }

    /* ── 記憶レベルチップ（グラデーション） ── */
    .level-chip {
      padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700;
    }
    .lv0 { background: #f1f5f9; color: #64748b; }
    .lv1 { background: #fee2e2; color: #b91c1c; }
    .lv2 { background: #ffedd5; color: #c2410c; }
    .lv3 { background: #fef9c3; color: #a16207; }
    .lv4 { background: #ecfccb; color: #3f6212; }
    .lv5 { background: #dcfce7; color: #15803d; }
    .lv6 { background: #ccfbf1; color: #0f766e; }
    .lv7 { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }

    /* ── ジャンル選択 ── */
    .genre-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px;
    }
    @media (min-width:480px) { .genre-grid { grid-template-columns: repeat(4,1fr); } }
    .genre-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 12px 6px; background: var(--bg); border: 2px solid var(--border);
      border-radius: 10px; cursor: pointer; font-size: .78rem; font-weight: 600;
      color: var(--text); transition: border-color .15s, background .15s;
    }
    .genre-btn:hover { border-color: var(--blue); background: var(--blue-l); color: var(--blue); }
    .genre-btn.selected { border-color: var(--blue); background: var(--blue-l); color: var(--blue); }
    .genre-btn .g-emoji { font-size: 1.4rem; }
    .genre-btn .g-cnt { font-size: .65rem; color: var(--muted); }

    /* ── ローディング・エラー ── */
    .center-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 50vh; text-align: center; gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── レビュースケジュール ── */
    .review-schedule { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    /* ── モーダル ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      background: var(--card); border-radius: var(--radius); padding: 24px;
      width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
      max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 6px; }
    .modal p  { font-size: .85rem; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
    .modal textarea {
      width: 100%; height: 180px; border: 2px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: .82rem; font-family: monospace; resize: vertical; margin-bottom: 12px;
    }
    .modal textarea:focus { outline: none; border-color: var(--blue); }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .modal input[type=text] {
      width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px;
      font-size: .95rem; margin-bottom: 12px;
    }
    .modal input[type=text]:focus { outline: none; border-color: var(--blue); }

    /* ── ユーザー一覧 ── */
    .user-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .user-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border: 2px solid var(--border); border-radius: 10px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .user-row:hover { border-color: var(--blue); background: var(--blue-l); }
    .user-row.current { border-color: var(--blue); background: var(--blue-l); }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--blue);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; flex-shrink: 0;
    }
    .user-row-name { font-weight: 700; flex: 1; }
    .user-row-stats { font-size: .78rem; color: var(--muted); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .code {
      background: #1e293b; color: #94a3b8; border-radius: 8px;
      padding: 12px 16px; font-family: monospace; font-size: .85rem; margin: 12px 0; text-align: left;
    }

    /* ── 認証画面 ── */
    #auth-screen {
      position: fixed; inset: 0; z-index: 300;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #0ea5e9 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .auth-card {
      background: #fff; border-radius: 20px; padding: 36px 28px;
      width: 100%; max-width: 400px; box-shadow: 0 24px 64px rgba(0,0,0,.35);
    }
    .auth-logo {
      font-size: 1.9rem; font-weight: 900; color: var(--blue);
      text-align: center; margin-bottom: 4px;
    }
    .auth-tagline { font-size: .88rem; color: var(--muted); text-align: center; margin-bottom: 28px; }
    .auth-sec-title {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); margin-bottom: 8px;
    }
    .auth-ulist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .auth-ubtn {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border: 2px solid var(--border); border-radius: 12px; cursor: pointer;
      background: var(--card); text-align: left; width: 100%;
      transition: border-color .15s, background .15s;
    }
    .auth-ubtn:hover { border-color: var(--blue); background: var(--blue-l); }
    .auth-uavatar {
      width: 38px; height: 38px; border-radius: 50%; background: var(--blue);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; flex-shrink: 0;
    }
    .auth-uname { font-weight: 700; font-size: .9rem; }
    .auth-ustats { font-size: .72rem; color: var(--muted); }
    .auth-or {
      display: flex; align-items: center; gap: 10px; margin: 16px 0;
      color: var(--muted); font-size: .8rem;
    }
    .auth-or::before, .auth-or::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
    .auth-input {
      width: 100%; padding: 13px 16px; border: 2px solid var(--border);
      border-radius: 10px; font-size: .95rem; margin-bottom: 10px;
      transition: border-color .15s;
    }
    .auth-input:focus { outline: none; border-color: var(--blue); }
    .auth-btn {
      width: 100%; padding: 14px; background: var(--blue); color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
    }
    .auth-btn:hover { opacity: .88; }

    /* ── 今日の100問ヒーロー ── */
    .daily-hero {
      background: linear-gradient(135deg, #1e40af, #2563eb 60%, #0ea5e9);
      border-radius: var(--radius); padding: 28px 24px; margin-bottom: 16px;
      color: #fff; position: relative; overflow: hidden;
    }
    .daily-hero-sub {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; opacity: .75; margin-bottom: 4px;
    }
    .daily-hero-title { font-size: 1.75rem; font-weight: 900; margin-bottom: 16px; line-height: 1.2; }
    .daily-hero-bar {
      background: rgba(255,255,255,.25); border-radius: 999px;
      height: 10px; margin-bottom: 8px; overflow: hidden;
    }
    .daily-hero-bar-fill { height: 100%; background: #fff; border-radius: 999px; transition: width .5s ease; }
    .daily-hero-cnt { font-size: .88rem; opacity: .88; margin-bottom: 18px; font-weight: 500; }
    .daily-hero-action {
      display: block; width: 100%; padding: 15px;
      background: rgba(255,255,255,.93); color: #1e40af;
      border: none; border-radius: 10px; font-size: 1.05rem;
      font-weight: 800; cursor: pointer; transition: background .15s, transform .1s;
    }
    .daily-hero-action:hover { background: #fff; transform: translateY(-1px); }
    .daily-complete {
      background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4);
      border-radius: 10px; padding: 14px 16px;
      font-weight: 700; text-align: center; font-size: .98rem;
    }
  </style>
</head>
<body>

<!-- 認証画面 -->
<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">📚 TOEIC Grammar</div>
    <div class="auth-tagline">毎日100問で文法力を定着させよう</div>

    <!-- ログインパネル (アカウント存在時) -->
    <div id="auth-panel-login" style="display:none">
      <div class="auth-sec-title">ユーザーを選択</div>
      <div id="auth-ulist" class="auth-ulist"></div>
      <div id="auth-pw-box" style="display:none;padding-top:4px">
        <input type="password" id="auth-pw-inp" class="auth-input" placeholder="パスワード"
          onkeydown="if(event.key==='Enter')doLogin()">
        <div id="auth-err" style="color:#dc2626;font-size:.82rem;margin-bottom:8px;display:none"></div>
        <button class="auth-btn" id="auth-login-btn" onclick="doLogin()">ログイン</button>
      </div>
      <div style="text-align:center;margin-top:16px">
        <button onclick="showSetupPanel()"
          style="background:none;border:none;color:var(--blue);font-size:.83rem;cursor:pointer;text-decoration:underline">
          ＋ アカウントを追加
        </button>
      </div>
    </div>

<script>
// ═══════════════════════════════════════════════════════════════
//  定数
// ═══════════════════════════════════════════════════════════════
const REVIEW_INTERVALS = [1, 3, 7, 14, 30, 60, 90];
const LEVEL_LABELS     = ['新規','1日','3日','1週','2週','1月','2月','定着'];
const LEVEL_COLORS     = ['#94a3b8','#f87171','#fb923c','#fbbf24','#a3e635','#4ade80','#2dd4bf','#60a5fa'];
const DAY_MS           = 86400000;
const DAILY_TARGET     = 100;

const GENRE_CATEGORIES = [
  { id: 'tense',   label: '時制',           emoji: '⏰', kw: ['時制','現在完了','過去完了','未来形','過去形','完了形','仮定法'] },
  { id: 'passive', label: '受動態',         emoji: '🔄', kw: ['受動態','受動','受け身'] },
  { id: 'modal',   label: '助動詞',         emoji: '🔧', kw: ['助動詞'] },
  { id: 'rel',     label: '関係詞',         emoji: '🔗', kw: ['関係代名詞','関係副詞'] },
  { id: 'prep',    label: '前置詞',         emoji: '📍', kw: ['前置詞'] },
  { id: 'conj',    label: '接続詞',         emoji: '💬', kw: ['接続詞'] },
  { id: 'infger',  label: '不定詞・動名詞', emoji: '📝', kw: ['不定詞','動名詞'] },
  { id: 'comp',    label: '比較',           emoji: '📊', kw: ['比較','比較級','最上級'] },
  { id: 'vocab',   label: '語彙・語法',     emoji: '📚', kw: [] },
];

function classifyQuestion(q) {
  const text = (q.explanation || '') + (q.question || '');
  for (const cat of GENRE_CATEGORIES) {
    if (cat.kw.some(kw => text.includes(kw))) return cat.id;
  }
  return 'vocab';
}

// ═══════════════════════════════════════════════════════════════
//  GitHub API
// ═══════════════════════════════════════════════════════════════
const GH_API    = 'https://api.github.com';
const GIST_DESC = 'TOEIC Grammar Trainer Progress';
const GIST_FILE = 'progress.json';
let _saveTimer  = null;

function getGhToken()    { return sessionStorage.getItem('gh_token'); }
function setGhToken(t)   { sessionStorage.setItem('gh_token', t); }
function getGhUser()     { try { return JSON.parse(sessionStorage.getItem('gh_user') || 'null'); } catch { return null; } }
function setGhUser(u)    { sessionStorage.setItem('gh_user', JSON.stringify(u)); }
function getGhGistId()   { return sessionStorage.getItem('gh_gist_id') || ''; }
function setGhGistId(id) { id ? sessionStorage.setItem('gh_gist_id', id) : sessionStorage.removeItem('gh_gist_id'); }
function clearSession()  { sessionStorage.clear(); }

async function ghFetch(path, opts = {}) {
  const token = getGhToken();
  const res = await fetch(GH_API + path, {
    ...opts,
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) throw new Error('GitHub API error ' + res.status);
  return res;
}

async function ghFindOrCreateGist() {
  let page = 1;
  while (true) {
    const r = await ghFetch(`/gists?per_page=100&page=${page}`);
    const gists = await r.json();
    const found = gists.find(g => g.description === GIST_DESC && g.files[GIST_FILE]);
    if (found) { setGhGistId(found.id); return found.id; }
    if (gists.length < 100) break;
    page++;
  }
  const cr = await ghFetch('/gists', {
    method: 'POST',
    body: { description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: '{"progress":{},"history":[]}' } } }
  });
  const g = await cr.json();
  setGhGistId(g.id);
  return g.id;
}

async function ghLoadData() {
  try {
    const gistId = await ghFindOrCreateGist();
    const r = await ghFetch('/gists/' + gistId);
    const g = await r.json();
    const content = g.files[GIST_FILE]?.content || '{}';
    return JSON.parse(content);
  } catch { return {}; }
}

async function ghSaveNow() {
  const gistId = getGhGistId();
  if (!gistId || !getGhToken()) return;
  setSyncBadge('saving');
  try {
    await ghFetch('/gists/' + gistId, {
      method: 'PATCH',
      body: { files: { [GIST_FILE]: { content: JSON.stringify({ progress, history }) } } }
    });
    setSyncBadge('synced');
  } catch(e) { console.error('Gist save failed:', e); setSyncBadge('error'); }
}

function scheduleSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(ghSaveNow, 2000);
}

function setSyncBadge(state) {
  const el = document.getElementById('sync-badge');
  if (!el) return;
  if (state === 'saving') { el.textContent = '⏳ 同期中'; el.style.color = 'var(--amber)'; }
  else if (state === 'synced') { el.textContent = '☁️ 同期済'; el.style.color = 'var(--green)'; }
  else if (state === 'error')  { el.textContent = '⚠️ 同期失敗'; el.style.color = 'var(--red)'; }
  else { el.textContent = ''; }
}

// ═══════════════════════════════════════════════════════════════
//  ローカルアカウント（PAT保存）
// ═══════════════════════════════════════════════════════════════
const ACCOUNTS_KEY = 'toeic_accounts';

function hashPw(pw) {
  try { return btoa(unescape(encodeURIComponent(pw + '_toeic2024'))); } catch { return btoa(pw); }
}
function loadAccounts() {
  try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]'); } catch { return []; }
}
function saveAccounts(a) { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }

// ═══════════════════════════════════════════════════════════════
//  認証
// ═══════════════════════════════════════════════════════════════
let _authUid = null;

function isAuthenticated() { return !!getGhToken(); }

function showAuthScreen() {
  document.getElementById('auth-screen').style.display = 'flex';
  if (loadAccounts().length > 0) showLoginPanel(); else showSetupPanel();
}

function hideAuthScreen() { document.getElementById('auth-screen').style.display = 'none'; }

function showLoginPanel() {
  document.getElementById('auth-panel-login').style.display = 'block';
  document.getElementById('auth-panel-setup').style.display = 'none';
  _authUid = null;
  const accounts = loadAccounts();
  document.getElementById('auth-ulist').innerHTML = accounts.map(a => `
    <button class="auth-ubtn" id="auth-ubtn-${escHtml(a.uid)}" onclick="selectAuthUser('${escHtml(a.uid)}')">
      <div class="auth-uavatar">${a.uid.charAt(0).toUpperCase()}</div>
      <div style="flex:1;text-align:left">
        <div class="auth-uname">${escHtml(a.uid)}</div>
        <div class="auth-ustats">${a.ghLogin ? '@'+escHtml(a.ghLogin) : ''}</div>
      </div>
      <span style="color:var(--muted);font-size:1.1rem">›</span>
    </button>
  `).join('');
  document.getElementById('auth-pw-box').style.display = 'none';
  document.getElementById('auth-err').style.display = 'none';
}

function showSetupPanel() {
  document.getElementById('auth-panel-login').style.display = 'none';
  document.getElementById('auth-panel-setup').style.display = 'block';
  const hasAccounts = loadAccounts().length > 0;
  document.getElementById('setup-back-wrap').style.display = hasAccounts ? 'block' : 'none';
  document.getElementById('setup-uid').value = '';
  document.getElementById('setup-pw').value  = '';
  document.getElementById('setup-pat').value = '';
  document.getElementById('setup-err').style.display = 'none';
  setTimeout(() => document.getElementById('setup-uid').focus(), 80);
}

function selectAuthUser(uid) {
  _authUid = uid;
  document.querySelectorAll('.auth-ubtn').forEach(b => b.style.borderColor = '');
  const btn = document.getElementById('auth-ubtn-' + uid);
  if (btn) btn.style.borderColor = 'var(--blue)';
  document.getElementById('auth-pw-box').style.display = 'block';
  document.getElementById('auth-err').style.display = 'none';
  document.getElementById('auth-pw-inp').value = '';
  setTimeout(() => document.getElementById('auth-pw-inp').focus(), 50);
}

async function doLogin() {
  const pw    = document.getElementById('auth-pw-inp').value;
  const errEl = document.getElementById('auth-err');
  const btn   = document.getElementById('auth-login-btn');
  if (!_authUid) return;
  const account = loadAccounts().find(a => a.uid === _authUid);
  if (!account) return;
  if (account.pwHash !== hashPw(pw)) {
    errEl.textContent = 'パスワードが違います'; errEl.style.display = 'block';
    document.getElementById('auth-pw-inp').value = '';
    document.getElementById('auth-pw-inp').focus();
    return;
  }
  errEl.style.display = 'none';
  btn.textContent = '接続中...'; btn.disabled = true;
  try { await _loginWithPat(account.pat); }
  catch(e) { errEl.textContent = e.message || 'ログイン失敗'; errEl.style.display = 'block'; }
  finally { btn.textContent = 'ログイン'; btn.disabled = false; }
}

async function doSetup() {
  const uid   = document.getElementById('setup-uid').value.trim();
  const pw    = document.getElementById('setup-pw').value;
  const pat   = document.getElementById('setup-pat').value.trim();
  const errEl = document.getElementById('setup-err');
  const btn   = document.getElementById('setup-btn');
  if (!uid) { errEl.textContent = 'ユーザーIDを入力してください'; errEl.style.display = 'block'; return; }
  if (!pw)  { errEl.textContent = 'パスワードを入力してください'; errEl.style.display = 'block'; return; }
  if (!pat) { errEl.textContent = 'GitHub PATを入力してください'; errEl.style.display = 'block'; return; }
  if (loadAccounts().find(a => a.uid === uid)) {
    errEl.textContent = 'そのユーザーIDは既に登録されています'; errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  btn.textContent = '確認中...'; btn.disabled = true;
  try {
    const r = await fetch(GH_API + '/user', {
      headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (r.status === 401) throw new Error('PATが無効です');
    if (!r.ok) throw new Error('GitHub接続失敗 (' + r.status + ')');
    const ghUser = await r.json();
    const accounts = loadAccounts();
    accounts.push({ uid, pwHash: hashPw(pw), pat, ghLogin: ghUser.login });
    saveAccounts(accounts);
    await _loginWithPat(pat);
  } catch(e) {
    errEl.textContent = e.message || '登録に失敗しました'; errEl.style.display = 'block';
  } finally {
    btn.textContent = '登録してスタート →'; btn.disabled = false;
  }
}

async function _loginWithPat(pat) {
  const r = await fetch(GH_API + '/user', {
    headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (r.status === 401) throw new Error('PATが期限切れです。設定から再登録してください。');
  if (!r.ok) throw new Error('GitHub接続失敗 (' + r.status + ')');
  const ghUser = await r.json();
  setGhToken(pat);
  setGhUser(ghUser);
  setSyncBadge('saving');
  let data;
  try { data = await ghLoadData(); }
  catch(e) {
    if (String(e.message).includes('403')) throw new Error('PATに gist スコープがありません');
    throw e;
  }
  progress = data.progress || {};
  history  = (data.history || []).filter(h => h.ts > Date.now() - 90 * DAY_MS);
  setSyncBadge('synced');
  hideAuthScreen();
  showView('dashboard');
  updateBadge();
}

function logout() {
  clearTimeout(_saveTimer);
  clearSession();
  progress = {}; history = [];
  showAuthScreen();
}

// ═══════════════════════════════════════════════════════════════
//  エビングハウス
// ═══════════════════════════════════════════════════════════════
function nextReview(level) {
  const days = REVIEW_INTERVALS[Math.min(level, REVIEW_INTERVALS.length - 1)];
  return Date.now() + days * DAY_MS;
}
function isDue(p) {
  if (!p || p.level === undefined) return true;
  if (p.level === 0) return true;
  return !p.nextReview || Date.now() >= p.nextReview;
}
function formatNextReview(p) {
  if (!p || !p.nextReview) return '今すぐ';
  const diff = p.nextReview - Date.now();
  if (diff <= 0) return '今すぐ';
  const days = Math.ceil(diff / DAY_MS);
  if (days === 1) return '明日';
  if (days < 7)  return `${days}日後`;
  if (days < 30) return `${Math.ceil(days/7)}週間後`;
  return `${Math.ceil(days/30)}ヶ月後`;
}

// ═══════════════════════════════════════════════════════════════
//  ストレージ（インメモリ + Gist）
// ═══════════════════════════════════════════════════════════════
function loadProgress()  { return progress; }
function saveProgress(p) { progress = p; scheduleSave(); }
function loadHistory()   { return history; }
function saveHistory(h)  {
  const cutoff = Date.now() - 90 * DAY_MS;
  history = h.filter(x => x.ts > cutoff);
  scheduleSave();
}
function recordStudy(qid, correct) {
  history.push({ ts: Date.now(), qid, correct });
  scheduleSave();
}
function updateQProgress(progress, qid, correct) {
  const p = progress[qid] || { level:0, correctCount:0, wrongCount:0, nextReview:null, firstStudied:Date.now() };
  if (correct) {
    p.level        = Math.min((p.level||0)+1, REVIEW_INTERVALS.length);
    p.correctCount = (p.correctCount||0)+1;
  } else {
    p.level    = 0;
    p.wrongCount = (p.wrongCount||0)+1;
  }
  p.nextReview   = nextReview(p.level);
  p.lastReviewed = Date.now();
  progress[qid]  = p;
  return progress;
}

// ═══════════════════════════════════════════════════════════════
//  問題データ読み込み
// ═══════════════════════════════════════════════════════════════
let questions = [];
let progress  = {};
let history   = [];
let session   = null;
let usingDemo = false;

const DEMO_QUESTIONS = [
  { id:1, question:"The committee _____ three times since the beginning of this year.",
    choices:{A:"has met",B:"met",C:"meets",D:"had met"}, answer:"A",
    translation:"委員会は今年の初めから3回会合を開いてきた。",
    explanation:"since（〜以来）は現在完了形と一緒に使います。",
    vocabulary:"committee: 委員会 / since: 〜以来" },
  { id:2, question:"All employees are required to _____ their ID badges at all times.",
    choices:{A:"wearing",B:"wore",C:"wear",D:"worn"}, answer:"C",
    translation:"全従業員は常にIDバッジを着用することが求められています。",
    explanation:"require + to 不定詞。are required to + 動詞の原形。",
    vocabulary:"employee: 従業員 / require: 要求する / badge: バッジ" },
  { id:3, question:"The new software _____ by the IT department next week.",
    choices:{A:"will install",B:"will be installed",C:"is installing",D:"installs"}, answer:"B",
    translation:"新しいソフトウェアは来週IT部門によってインストールされる予定です。",
    explanation:"主語はインストールされる側なので受動態。未来受動態 = will be + 過去分詞。",
    vocabulary:"software: ソフトウェア / install: インストールする" },
];

async function loadQuestions() {
  try {
    const r = await fetch('questions.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (Array.isArray(data) && data.length > 0) {
      questions = data; usingDemo = false;
      return true;
    }
  } catch {}
  questions = DEMO_QUESTIONS; usingDemo = true;
  return false;
}

function openImport()  { document.getElementById('import-modal').style.display='flex'; setTimeout(()=>document.getElementById('import-textarea').focus(),100); }
function closeImport() { document.getElementById('import-modal').style.display='none'; document.getElementById('import-textarea').value=''; }
function doImport() {
  const text = document.getElementById('import-textarea').value.trim();
  if (!text) { alert('テキストが空です'); return; }
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data) || data.length === 0) throw new Error();
    questions = data; usingDemo = false;
    closeImport(); showView('dashboard');
    alert(`✅ ${data.length}問を読み込みました！`);
  } catch { alert('エラー：正しいJSONではありません。'); }
}

// ═══════════════════════════════════════════════════════════════
//  キュービルダー
// ═══════════════════════════════════════════════════════════════
function usableQuestions(genreId) {
  let qs = questions.filter(q => q.answer && q.choices && q.choices.A);
  if (genreId && genreId !== 'all') qs = qs.filter(q => classifyQuestion(q) === genreId);
  return qs;
}

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQueue(mode, genreId) {
  const qs = usableQuestions(genreId);
  let ids;
  if (mode === 'review') {
    ids = qs.filter(q => { const p=progress[q.id]; return p && p.level>0 && isDue(p); }).map(q=>q.id);
  } else if (mode === 'new') {
    ids = qs.filter(q => !progress[q.id] || progress[q.id].level===0).map(q=>q.id).slice(0,20);
  } else if (mode === 'daily') {
    return buildDailyQueue(genreId);
  } else {
    ids = qs.filter(q => { const p=progress[q.id]; return !p || p.level < REVIEW_INTERVALS.length; }).map(q=>q.id);
  }
  return shuffle(ids);
}

function buildDailyQueue(genreId) {
  const today  = new Date(); today.setHours(0,0,0,0);
  const user   = getGhUser();
  const uid    = user ? user.login : 'guest';
  const dayKey = `toeic_daily_${uid}_${today.toISOString().slice(0,10)}${genreId?'_'+genreId:''}`;
  const saved  = sessionStorage.getItem(dayKey);
  if (saved) {
    try { const q = JSON.parse(saved); if (Array.isArray(q) && q.length) return q; } catch {}
  }
  const qs   = usableQuestions(genreId);
  const due  = shuffle(qs.filter(q => { const p=progress[q.id]; return p && p.level>0 && isDue(p); }).map(q=>q.id));
  const newQ = shuffle(qs.filter(q => !progress[q.id] || progress[q.id].level===0).map(q=>q.id));
  const combined = [...due, ...newQ].slice(0, DAILY_TARGET);
  if (!combined.length) return shuffle(qs.map(q=>q.id).slice(0, DAILY_TARGET));
  sessionStorage.setItem(dayKey, JSON.stringify(combined));
  return combined;
}

// ═══════════════════════════════════════════════════════════════
//  統計ヘルパー
// ═══════════════════════════════════════════════════════════════
function calcStats(genreId) {
  const qs      = usableQuestions(genreId);
  const total   = qs.length;
  const studied = qs.filter(q => (progress[q.id]?.level??0) > 0).length;
  const mastered= qs.filter(q => (progress[q.id]?.level??0) >= REVIEW_INTERVALS.length).length;
  const dueToday= qs.filter(q => isDue(progress[q.id]) && (progress[q.id]?.level??0) > 0).length;
  const newCount= qs.filter(q => !progress[q.id] || progress[q.id].level===0).length;
  const levelCounts = new Array(REVIEW_INTERVALS.length+1).fill(0);
  qs.forEach(q => { const lv=progress[q.id]?.level??0; levelCounts[Math.min(lv,REVIEW_INTERVALS.length)]++; });
  const history     = loadHistory();
  const todayStart  = new Date(); todayStart.setHours(0,0,0,0);
  const todayAns    = history.filter(h => h.ts >= todayStart.getTime());
  const todayCorrect= todayAns.filter(h => h.correct).length;
  const todayTotal  = todayAns.length;
  return { total, studied, mastered, dueToday, newCount, levelCounts, todayCorrect, todayTotal };
}

function getTodayStats() {
  const history    = loadHistory();
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayAns   = history.filter(h => h.ts >= todayStart.getTime());
  return { done: todayAns.length, correct: todayAns.filter(h => h.correct).length };
}

// ═══════════════════════════════════════════════════════════════
//  セッション開始・問題表示
// ═══════════════════════════════════════════════════════════════
function startSession(mode, genreId) {
  const queue = buildQueue(mode, genreId || selectedGenre);
  if (!queue.length) {
    alert(mode==='review' ? '今日の復習予定はありません！' : '問題がありません。');
    return;
  }
  session = { queue, idx:0, correct:0, wrong:0, mode, genreId: genreId||selectedGenre };
  ['nav-dash','nav-stats'].forEach(id => document.getElementById(id)?.classList.remove('active'));
  document.getElementById('nav-study').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  if (!session || session.idx >= session.queue.length) { renderResult(); return; }
  const qid   = session.queue[session.idx];
  const q     = questions.find(x => x.id === qid);
  if (!q) { session.idx++; renderQuestion(); return; }
  const p     = progress[qid];
  const lv    = p?.level ?? 0;
  const total = session.queue.length;
  const qText = q.question.replace(/_{3,}|——-+/g, '<span class="q-blank">　　　　</span>');
  const modeLabel = { daily:'📅 今日の100問', review:'🔄 復習', new:'✨ 新規', all:'📖 全問' }[session.mode] || '📖 学習';

  document.getElementById('view').innerHTML = `
    <div class="session-header">
      <div class="session-info">${modeLabel}</div>
      <div class="session-progress">${session.idx+1} / ${total}</div>
    </div>
    <div style="margin-bottom:12px">
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(session.idx/total*100)}%"></div></div>
    </div>
    <div class="q-card">
      <div class="q-num">
        第 ${q.id} 問
        <span class="level-chip lv${Math.min(lv,7)}" style="margin-left:8px">${LEVEL_LABELS[Math.min(lv,7)]}</span>
      </div>
      <div class="q-text">${qText}</div>
      <div class="choices" id="choices">
        ${['A','B','C','D'].map(l => `
          <button class="choice-btn" id="choice-${l}" onclick="selectAnswer('${l}','${qid}')">
            <span class="choice-label">${l}</span>
            <span>${escHtml(q.choices[l]||'')}</span>
          </button>`).join('')}
      </div>
    </div>
    <div id="feedback"></div>`;
}

function selectAnswer(selected, qid) {
  const q       = questions.find(x => x.id == qid);
  const correct = selected === q.answer;
  ['A','B','C','D'].forEach(l => {
    const btn = document.getElementById('choice-'+l);
    btn.disabled = true;
    if (l === q.answer) btn.classList.add('correct');
    else if (l === selected && !correct) btn.classList.add('wrong');
  });
  progress = updateQProgress(progress, qid, correct);
  saveProgress(progress);
  recordStudy(qid, correct);
  if (correct) session.correct++; else session.wrong++;
  const p        = progress[qid];
  const nextDate = formatNextReview(p);
  document.getElementById('feedback').innerHTML = `
    <div class="feedback ${correct?'correct-fb':'wrong-fb'}">
      <div class="feedback-title">${correct ? '✅ 正解！' : `❌ 不正解（正解: (${q.answer}) ${escHtml(q.choices[q.answer])}）`}</div>
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:10px">
        次回の復習: <b>${nextDate}</b>
        <span class="level-chip lv${Math.min(p.level,7)}" style="margin-left:6px">${LEVEL_LABELS[Math.min(p.level,7)]}</span>
      </div>
      ${q.translation  ? `<div class="detail-section"><div class="detail-label">訳</div><div class="detail-text">${escHtml(q.translation)}</div></div>` : ''}
      ${q.explanation  ? `<div class="detail-section"><div class="detail-label">解説</div><div class="detail-text">${escHtml(q.explanation)}</div></div>` : ''}
      ${q.vocabulary   ? `<div class="detail-section"><div class="detail-label">語彙</div><div class="detail-text">${escHtml(q.vocabulary)}</div></div>` : ''}
    </div>
    <button class="next-btn" onclick="nextQuestion()">
      ${session.idx+1 < session.queue.length ? '次の問題 →' : '結果を見る'}
    </button>`;
  updateBadge();
}

function nextQuestion() {
  session.idx++;
  renderQuestion();
  document.getElementById('view').scrollIntoView({ behavior:'smooth', block:'start' });
}

  const msg   = pct>=90?'素晴らしい！':pct>=70?'よくできました！':pct>=50?'もう少し！':'復習を続けましょう！';
  const s     = calcStats(session.genreId);
  document.getElementById('view').innerHTML = `
    <div class="card result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-sub">正解率 ${pct}%</div>

        <div class="score-item"><div class="score-num" style="color:var(--red)">${session.wrong}</div><div class="score-lbl">不正解</div></div>

      ${s.dueToday>0?`<div class="alert" style="text-align:left;margin-bottom:20px"><span class="alert-icon">🔔</span><span>残り <b>${s.dueToday}問</b> の復習が予定されています</span></div>`:''}
      <div class="btn-row">
        <button class="btn btn-primary" onclick="startSession('daily',session?.genreId)">今日の100問を続ける</button>
        ${s.dueToday>0?`<button class="btn btn-outline" onclick="startSession('review',session?.genreId)">復習 (${s.dueToday}問)</button>`:''}
        <button class="btn btn-outline" onclick="showView('dashboard')">ホームへ</button>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  ビュー：統計
// ═══════════════════════════════════════════════════════════════
function renderStats() {
  const s   = calcStats();
  const acc = s.todayTotal ? Math.round(s.todayCorrect/s.todayTotal*100) : 0;
  const pct = s.total ? Math.round(s.mastered/s.total*100) : 0;

  // カレンダー（直近35日 → 正解数ベースで色分け）
  const history      = loadHistory();
  const correctByDay = {}, totalByDay = {};
  history.forEach(h => {
    const d = new Date(h.ts); d.setHours(0,0,0,0);
    const k = d.getTime();
    totalByDay[k] = (totalByDay[k]||0) + 1;
    if (h.correct) correctByDay[k] = (correctByDay[k]||0) + 1;
  });
  const today = new Date(); today.setHours(0,0,0,0);
  const cells = [];
  for (let i = 34; i >= 0; i--) {
    const d = new Date(today.getTime() - i*DAY_MS);
    d.setHours(0,0,0,0);
    const correct  = correctByDay[d.getTime()] || 0;
    const total    = totalByDay[d.getTime()]   || 0;
    const isToday  = d.getTime() === today.getTime();
    const cls      = correct===0?'':correct<25?'s1':correct<50?'s2':correct<75?'s3':correct<90?'s4':'s5';
    const day      = d.getDate();
    const mm       = d.getMonth()+1;
    const label    = day===1 || i===34 ? `${mm}/${day}` : String(day);
    cells.push(`<div class="cal-day${cls?' '+cls:''}${isToday?' today':''}" title="${mm}/${day} 正解:${correct}/${total}">
      <span class="cal-day-num">${label}</span>
      ${correct>0?`<span class="cal-cnt">${correct}</span>`:''}
    </div>`);
  }

  const upcomingHtml = renderUpcomingReviews();

  return `
    <div class="card">
      <div class="card-title">今日の学習</div>
      <div class="stats-detail-grid">
        <div class="mini-stat"><div class="mini-stat-num">${s.todayTotal}</div><div class="mini-stat-lbl">解答数</div></div>
        <div class="mini-stat"><div class="mini-stat-num" style="color:var(--green)">${acc}%</div><div class="mini-stat-lbl">正解率</div></div>
        <div class="mini-stat"><div class="mini-stat-num" style="color:var(--amber)">${s.dueToday}</div><div class="mini-stat-lbl">今日の復習予定</div></div>
        <div class="mini-stat"><div class="mini-stat-num" style="color:var(--purple)">${s.mastered}</div><div class="mini-stat-lbl">定着済み</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">全体進捗 (${pct}%)</div>
      <div class="progress-bar" style="height:12px"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-labels"><span>学習済み: ${s.studied}問</span><span>定着: ${s.mastered} / ${s.total}</span></div>
    </div>
    <div class="card">
      <div class="card-title">記憶レベル分布（グラデーション）</div>
      <div class="level-bars" id="lvbars-stats"></div>
      <div class="review-schedule" style="margin-top:14px">
        ${LEVEL_LABELS.map((l,i)=>`<span class="level-chip lv${i}">${l}: ${s.levelCounts[i]??0}問</span>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">学習カレンダー（直近35日 — 正解数）</div>
      <div style="display:flex;gap:8px;font-size:.7rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap">
        <span>□ 0問</span>
        <span style="color:#1e40af">■ 1〜24</span>
        <span style="color:#2563eb">■ 25〜49</span>
        <span style="color:#1d4ed8">■ 50〜74</span>
        <span style="color:#1e3a8a">■ 75〜89</span>
        <span style="color:#1e3a8a;font-weight:800">■ 90+</span>
      </div>
      <div class="calendar-grid">${cells.join('')}</div>
    </div>
    <div class="card">
      <div class="card-title">ジャンル別正答率</div>
      ${GENRE_CATEGORIES.map(cat => {
        const catQs = usableQuestions(cat.id);
        let cor = 0, tot = 0;
        catQs.forEach(q => { const p=progress[q.id]; if(p){ cor+=(p.correctCount||0); tot+=(p.correctCount||0)+(p.wrongCount||0); } });
        const acc = tot ? Math.round(cor/tot*100) : 0;
        const h   = Math.round(acc * 1.2);
        const col = tot ? `hsl(${h},70%,45%)` : 'var(--muted)';
        const lbl = tot ? `${acc}%` : '未';
        return `<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:.88rem;font-weight:600">${cat.emoji} ${cat.label}
              <span style="color:var(--muted);font-weight:400;font-size:.78rem"> ${catQs.length}問</span>
            </span>
            <span style="font-weight:800;color:${col}">${lbl}</span>
          </div>
          <div class="progress-bar" style="height:7px">
            <div class="progress-fill" style="width:${acc}%;background:${col};transition:width .4s,background .4s"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="card-title">次回復習スケジュール</div>
      ${upcomingHtml}
    </div>`;
}

function renderUpcomingReviews() {
  const upcoming = questions
    .filter(q => { const p=progress[q.id]; return p && p.level>0 && p.nextReview; })
    .sort((a,b) => (progress[a.id].nextReview||0)-(progress[b.id].nextReview||0))
    .slice(0,10);
  if (!upcoming.length) return '<div style="color:var(--muted);font-size:.9rem">まだ復習予定がありません</div>';
  return upcoming.map(q => {
    const p = progress[q.id];
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem">
      <span>Q${q.id}: ${escHtml(q.question.slice(0,40))}…</span>
      <span class="level-chip lv${Math.min(p.level,7)}">${formatNextReview(p)}</span>
    </div>`;
  }).join('');
}

function renderLevelBarsById(id, stats) {
  const el = document.getElementById(id);
  if (!el) return;
  const max = Math.max(...stats.levelCounts, 1);
  el.innerHTML = stats.levelCounts.map((cnt,i) => {
    const h = Math.max(4, Math.round(cnt/max*52));
    return `<div class="level-bar-wrap">
      <div class="level-bar" style="height:${h}px;background:${LEVEL_COLORS[Math.min(i,7)]}"></div>
      <div class="level-bar-label">Lv${i}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
//  ナビゲーション

function showView(name) {
  const view = document.getElementById('view');
  ['dash','study','stats','settings'].forEach(id => document.getElementById('nav-'+id)?.classList.remove('active'));
  if (name === 'dashboard') {
    document.getElementById('nav-dash').classList.add('active');
    view.innerHTML = renderDashboard();
    renderLevelBarsById('lvbars', calcStats());
  } else if (name === 'stats') {
    document.getElementById('nav-stats').classList.add('active');
    view.innerHTML = renderStats();
    renderLevelBarsById('lvbars-stats', calcStats());
  } else if (name === 'study-menu') {
    document.getElementById('nav-study').classList.add('active');
    view.innerHTML = renderStudyMenu();
  } else if (name === 'settings') {
    document.getElementById('nav-settings').classList.add('active');
    view.innerHTML = renderSettings();
  }
  updateBadge();
}

          style="width:100%;padding:12px;background:var(--red-l);color:var(--red);border:none;
                 border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer">
          このデバイスからアカウントを削除
        </button>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-title">データ保存場所</div>
      <div style="background:var(--bg);border-radius:10px;padding:14px;font-size:.85rem;line-height:1.7">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:1.2rem">☁️</span>
          <div>
            <div style="font-weight:700">GitHub Gist（プライベート）</div>
            <div style="font-size:.76rem;color:var(--muted)">進捗データはGitHubのプライベートGistに保存</div>
          </div>
        </div>
        ${gistId ? `<div style="margin-top:6px">${gistLink}</div>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-title">データ管理</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-outline" onclick="ghSaveNow()">☁️ 今すぐ同期</button>
        <button class="btn btn-outline" onclick="refreshQuestions()">🔄 問題データを再取得</button>
        <button class="btn btn-outline" onclick="openImport()">📋 JSONを直接貼り付け</button>
        <button class="btn btn-outline" style="color:var(--red);border-color:var(--red)"
          onclick="if(confirm('学習進捗・履歴をすべてリセットしますか？'))resetAll()">🗑️ 進捗をリセット</button>
      </div>
    </div>`;
}

function removeAccount(uid) {
  if (!confirm(`「${uid}」をこのデバイスから削除しますか？\nGitHubのデータは保持されます。`)) return;
  const accounts = loadAccounts().filter(a => a.uid !== uid);
  saveAccounts(accounts);
  clearTimeout(_saveTimer);
  clearSession();
  progress = {}; history = [];
  showAuthScreen();
}

function updateBadge() {
  const s = calcStats();
  const b = document.getElementById('review-badge');
  if (!b) return;
  if (s.dueToday > 0) { b.style.display=''; b.textContent=s.dueToday; }
  else { b.style.display='none'; }
}

function resetAll() {
  progress = {}; history = [];
  scheduleSave();
  showView('dashboard');
}

async function refreshQuestions() {
  const ok = await loadQuestions();
  alert(ok ? `✅ ${questions.length}問を再取得しました` : 'questions.json が見つかりません。');
  if (ok) showView('stats');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════
//  初期化
// ═══════════════════════════════════════════════════════════════
window.addEventListener('beforeunload', () => { ghSaveNow(); });

(async () => {
  document.getElementById('view').innerHTML = `
    <div class="center-box"><div class="spinner"></div><div style="color:var(--muted)">読み込み中...</div></div>`;
  await loadQuestions();
  showAuthScreen();
})();
</script>
</body>
</html>
